<script>
const API = 'https://agentic-ai-vglg.onrender.com';
let currentTaskId = null;
let selectedAgent = null;

// Fetch & render tasks
async function refresh(){
  const q = document.getElementById('search').value;
  let url = API + '/tasks' + (q?('?search='+encodeURIComponent(q)):'');
  const resp = await fetch(url);
  let tasks = await resp.json();

  if(selectedAgent){
    tasks = tasks.filter(t=>t.assigned_agent===selectedAgent);
    await loadAgentMessages(selectedAgent); // show agent messages
  } else {
    document.getElementById('chatPane').innerHTML='';
  }

  const ul = document.getElementById('taskList');
  ul.innerHTML='';
  tasks.forEach(t=>{
    const li=document.createElement('li');
    const statusClass=t.status?.toLowerCase()||'open';
    li.innerHTML=`<div style="flex:1">
      <div><strong>${t.department}</strong> • ${t.description}</div>
      <div class="meta">
        Assigned to: ${t.assignee||'—'} • 
        Agent: <span class="badge ${t.assigned_agent?'assigned':'open'}">${t.assigned_agent||'—'}</span> • 
        Status: <span class="badge ${statusClass}">${t.status||'OPEN'}</span>
      </div></div>
      <div style="display:flex;gap:8px">
        <button onclick="assign(${t.id})" class="secondary">Auto-Assign</button>
        <button onclick="openChat(${t.id})" class="secondary">Chat</button>
        <button onclick="deleteTask(${t.id})" class="danger">Delete</button>
      </div>`;
    li.style.display='flex'; li.style.justifyContent='space-between';
    ul.appendChild(li);
  });
}

async function loadResources(){
  const resp = await fetch(API + '/resources');
  const data = await resp.json();
  const ul = document.getElementById('resourceList');
  ul.innerHTML='';
  data.forEach(r=>{
    const li=document.createElement('li');
    li.innerHTML = `<div style="flex:1">
        <strong>${r.name}</strong> (${r.category}) — Qty: ${r.quantity}
        <div class="meta">Status: <span class="badge ${r.status==='ALLOCATED'?'assigned':'open'}">${r.status}</span> 
        • Allocated to: ${r.allocated_to || '—'}</div>
      </div>
      <div style="display:flex;gap:8px">
        ${r.status==='AVAILABLE'
          ? `<button class="secondary" onclick="allocateResource(${r.id})">Allocate</button>`
          : `<button class="danger" onclick="releaseResource(${r.id})">Release</button>`}
      </div>`;
    ul.appendChild(li);
  });
}

document.getElementById('resourceForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const name=document.getElementById('rname').value;
  const category=document.getElementById('rcategory').value;
  const quantity=parseInt(document.getElementById('rquantity').value);
  await fetch(API+'/resources',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name,category,quantity})});
  e.target.reset();
  await loadResources();
});

async function allocateResource(id){
  const department=prompt('Enter department to allocate to:');
  if(!department) return;
  await fetch(API+'/allocate/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({department})});
  await loadResources();
}

async function releaseResource(id){
  await fetch(API+'/release/'+id,{method:'POST'});
  await loadResources();
}

// Load agents & make clickable
async function loadAgents(){
  const r=await fetch(API + '/agents');
  const agents=await r.json();
  const container=document.getElementById('agents');
  container.innerHTML='';
  agents.forEach(a=>{
    const div=document.createElement('div');
    div.className='agent';
    div.innerHTML=`<strong>${a.name}</strong><div>${a.specialties}</div>`;
    div.onclick=async ()=>{
      selectedAgent = selectedAgent===a.name?null:a.name;
      document.querySelectorAll('#agents .agent').forEach(el=>el.classList.remove('selected'));
      if(selectedAgent) div.classList.add('selected');
      await refresh();
    };
    container.appendChild(div);
  });
}

// Load all messages for an agent
async function loadAgentMessages(agentName){
  const resp=await fetch(API+'/agent_messages/'+encodeURIComponent(agentName));
  const logs=await resp.json();
  const pane=document.getElementById('chatPane');
  pane.innerHTML='';
  logs.forEach(l=>{
    const el=document.createElement('div');
    el.className=l.role==='assistant'?'chat':(l.role==='user'?'user':'small');
    el.innerHTML=`<div class="small"><strong>Task #${l.task_id} - ${l.role}</strong> — ${new Date(l.ts).toLocaleString()}</div><div>${l.message}</div>`;
    pane.appendChild(el);
  });
  pane.scrollTop=pane.scrollHeight;
}

// Chat & task functions
document.getElementById('taskForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const department=document.getElementById('department').value;
  const description=document.getElementById('description').value;
  const assignee=document.getElementById('assignee').value||null;
  await fetch(API+'/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({department,description,assignee})});
  document.getElementById('taskForm').reset();
  await refresh();
});

// Delete a task
async function deleteTask(taskId){
  try {
    const resp = await fetch(`${API}/tasks/${taskId}`, { method: 'DELETE' });
    if(resp.ok){
      if(currentTaskId===taskId){ 
        currentTaskId=null; 
        document.getElementById('chatPane').innerHTML=''; 
      }
      await refresh();
    } else {
      const err = await resp.json();
      alert(`Failed to delete task: ${err.detail || 'Unknown error'}`);
    }
  } catch(err){
    console.error(err);
    alert('Error deleting task.');
  }
}

// Assign a task automatically
async function assign(taskId){
  try {
    const resp = await fetch(`${API}/assign/${taskId}`, { method: 'POST' });
    const data = await resp.json();
    alert(`Task #${taskId} assigned to ${data.assigned_agent}`);
    await refresh(); // refresh tasks & agents view
  } catch(err) {
    console.error(err);
    alert('Error assigning task.');
  }
}

async function openChat(id){
  currentTaskId=id;
  await loadChat(id);
}

async function loadChat(id){
    const resp = await fetch(API + '/chat/' + id);
    const logs = await resp.json();
    const pane = document.getElementById('chatPane');
    pane.innerHTML = '';

    if(logs.length === 0){
        // Show a default message if chat is empty
        const el = document.createElement('div');
        el.className = 'small';
        el.innerHTML = 'No messages yet for this task.';
        pane.appendChild(el);
    } else {
        logs.forEach(l => {
            const el = document.createElement('div');
            el.className = l.role === 'assistant' ? 'chat' : (l.role === 'user' ? 'user' : 'small');
            el.innerHTML = `<div class="small"><strong>${l.role}</strong> — ${new Date(l.ts).toLocaleString()}</div><div>${l.message}</div>`;
            pane.appendChild(el);
        });
    }
    pane.scrollTop = pane.scrollHeight;
}

async function assign(taskId){
  try {
    const resp = await fetch(`${API}/assign/${taskId}`, { method: 'POST' });
    const data = await resp.json();
    alert(`Task #${taskId} assigned to ${data.assigned_agent}`);
    await refresh();               // refresh task list
    await openChat(taskId);        // open chat immediately after assignment
  } catch(err) {
    console.error(err);
    alert('Error assigning task.');
  }
}

document.getElementById('sendBtn').addEventListener('click',async ()=>{
  const text=document.getElementById('chatInput').value.trim();
  if(!text || (!currentTaskId && !selectedAgent)) return alert('Select a task or agent and type a message.');
  document.getElementById('chatInput').value='';

  if(currentTaskId){
    await fetch(API+'/chat/'+currentTaskId,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    await loadChat(currentTaskId);
  } else if(selectedAgent){
    // Post to all tasks assigned to this agent

    const tasks = await tasksResp.json().filter(t=>t.assigned_agent===selectedAgent);
    for(const t of tasks){
      await fetch(API+'/chat/'+t.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    }
    await loadAgentMessages(selectedAgent);
  }
});

// Initialize
loadAgents();
refresh();
loadResources();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root {
  --primary: #0ea5a4;
  --primary-dark: #0d8c8b;

  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;

  min-height: 100vh;
  padding: 24px;
  margin: 0;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
}

.header {
  text-align: center;
  margin-bottom: 32px;
  color: white;
}

.header h1 {
  font-size: 2.5rem;
  font-weight: 700;
  margin-bottom: 8px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.2);
}

.header p {
  font-size: 1rem;
  opacity: 0.9;
  font-weight: 300;
}

.row {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}

.left {
  flex: 1;
  min-width: 400px;
}

.right {
  width: 450px;
  position: sticky;
  top: 24px;
  height: calc(100vh - 48px);
  overflow-y: auto;
}

.card {
  background: var(--bg-card);
  border-radius: 20px;
  padding: 28px;
  box-shadow: var(--shadow-lg);
  backdrop-filter: blur(10px);
  margin-bottom: 24px;
}

h3 {
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--text-primary);

  padding-bottom: 12px;

  display: flex;
  align-items: center;

}

h3::before {

  height: 24px;
  background: var(--primary);
  border-radius: 2px;
}

input, textarea {
  width: 100%;
  padding: 12px 16px;
  border-radius: 12px;
  border: 2px solid var(--border);
  font-size: 0.9375rem;
  font-family: inherit;
  transition: all 0.2s ease;
  background: var(--bg-main);
  margin-top: 8px;
}

input:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);

textarea {
  resize: vertical;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 12px;
  font-size: 0.9375rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
  margin-top: 12px;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

button:active {
  transform: translateY(0);
}

.primary {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);

  margin-right: 8px;

.secondary {
  background: var(--secondary);
  color: white;
  margin-right: 8px;

  background: var(--danger);
  color: white;
}

  position: relative;
  margin-top: 18px;
  margin-bottom: 12px;

  padding-left: 44px;
}

  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);

  z-index: 1;
}

ul {
  list-style: none;
  margin-top: 16px;
  padding: 0;
}

li {
  background: var(--bg-main);
  padding: 18px;
  border-radius: 14px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all 0.2s;
  position: relative;
  border: 2px solid transparent;
}

li:hover {
  background: #e0f2f1;
  border-color: var(--primary-light);
  transform: translateX(4px);
}

.item-content {
  flex: 1;
}

.item-title {
  font-weight: 600;
  font-size: 1rem;
  margin-bottom: 6px;
}

.meta {
  font-size: 12px;
  color: #475569;
  margin-top: 6px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.badge {
  padding: 3px 10px;

  color: #fff;

.badge.open {
  background: #64748b;

.badge.assigned {
  background: #0ea5a4;

.badge.completed {

.item-actions {
  display: flex;

  flex-wrap: wrap;

}

  height: 360px;
  overflow-y: auto;
  padding: 12px;
  background: #f1f5f9;
  border-radius: 12px;
  scroll-behavior: smooth;
  margin-bottom: 12px;
  display: flex;
  flex-direction: column;
}

.chat {
  background: #0f172a;
  color: #fff;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 8px;
  max-width: 80%;
  word-wrap: break-word;
}

.user {
  background: #e6fffa;
  color: #064e3b;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 8px;
  max-width: 80%;
  align-self: flex-end;
  word-wrap: break-word;
}

.small {
  font-size: 12px;
  color: #64748b;
  margin-bottom: 4px;
}

.chat-input {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.chat-input input {
  flex: 1;
  margin-top: 0;
}

.chat-input button {
  margin-top: 0;
}

#agents .agent {
  padding: 14px;
  border-radius: 10px;
  background: var(--bg-main);
  margin-bottom: 10px;
  transition: all 0.2s;
  cursor: pointer;
  border: 2px solid transparent;
}

#agents .agent:hover {
  background: #e0f2f1;
  border-color: var(--primary-light);
}

#agents .agent.selected {
  background: linear-gradient(135deg, #0ea5a4 0%, #0d8c8b 100%);
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 4px 12px rgba(14, 165, 164, 0.3);
}

#agents .agent strong {
  display: block;
  font-size: 1rem;
  margin-bottom: 4px;
}

#agents .agent div {
  font-size: 0.875rem;
  opacity: 0.85;
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
}

@media(max-width:950px) {
  .row {
    flex-direction: column;
  }
  .right {
    width: 100%;
    position: relative;
    height: auto;
    top: auto;
  }
  .left {
    min-width: 100%;
  }
}
</style>
</head>

    <p>AI-Powered Task & Resource Management</p>
  </div>

    <div class="left">
      <div class="card">
        <form id="taskForm">
          <input id="department" placeholder="Department (e.g., Research, Admin)" required>
          <textarea id="description" placeholder="Describe the task..." rows="3"></textarea>
          <input id="assignee" placeholder="Human assignee (optional)">
          <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
            <button type="submit" class="primary">✨ Create Task</button>
            <button type="button" class="secondary" onclick="refresh()">🔄 Refresh</button>
          </div>
        </form>
        <div class="search-box">
          <input id="search" placeholder="Search by text..." oninput="refresh()">
        </div>

      </div>

      <div class="card">
        <h3>Resources</h3>
        <form id="resourceForm">
          <input id="rname" placeholder="Resource Name" required>

          <input id="rquantity" type="number" placeholder="Quantity" required>
          <button type="submit" class="primary">➕ Add Resource</button>
        </form>
        <ul id="resourceList"></ul>
      </div>
    </div>

    <div class="right">
      <div class="card">
        <h3>AI Agents</h3>
        <div id="agents"></div>
      </div>
      
      <div class="card">
        <h3>Chat</h3>
        <div id="chatPane" class="chat-area"></div>
        <div class="chat-input">
          <input id="chatInput" placeholder="Type a message...">
          <button id="sendBtn" class="primary">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8000';
let currentTaskId = null;
let selectedAgent = null;

async function refresh(){
  const q = document.getElementById('search').value;
  let url = API + '/tasks' + (q?('?search='+encodeURIComponent(q)):'');
  try {
    const resp = await fetch(url);
    let tasks = await resp.json();

    if(selectedAgent){
      tasks = tasks.filter(t=>t.assigned_agent===selectedAgent);
      await loadAgentMessages(selectedAgent);
    } else if (!currentTaskId) {
      document.getElementById('chatPane').innerHTML='<div class="empty-state">💬<br>Select a task or agent to start chatting</div>';
    }

    const ul = document.getElementById('taskList');
    ul.innerHTML='';
    
    if(tasks.length === 0){
      ul.innerHTML='<div class="empty-state">📋<br>No tasks found</div>';
      return;
    }
    
    tasks.forEach(t=>{
      const li=document.createElement('li');
      const statusClass=t.status?.toLowerCase()||'open';
      li.innerHTML=`
        <div class="item-content">
          <div class="item-title"><strong>${t.department}</strong> • ${t.description}</div>
          <div class="meta">
            👤 Assigned to: ${t.assignee||'—'} • 
            Agent: <span class="badge ${t.assigned_agent?'assigned':'open'}">${t.assigned_agent||'—'}</span> • 
            Status: <span class="badge ${statusClass}">${t.status||'OPEN'}</span>
          </div>
        </div>
        <div class="item-actions">
          <button onclick="assign(${t.id})" class="secondary">✨ Auto-Assign</button>
          <button onclick="openChat(${t.id})" class="secondary">💬 Chat</button>
          <button onclick="deleteTask(${t.id})" class="danger">🗑️ Delete</button>
        </div>`;
      ul.appendChild(li);
    });
  } catch(err) {
    console.error('Error fetching tasks:', err);
  }
}

async function loadResources(){
  try {
    const resp = await fetch(API + '/resources');
    const data = await resp.json();
    const ul = document.getElementById('resourceList');
    ul.innerHTML='';
    
    if(data.length === 0){
      ul.innerHTML='<div class="empty-state">📦<br>No resources found</div>';
      return;
    }
    
    data.forEach(r=>{
      const li=document.createElement('li');
      li.innerHTML = `
        <div class="item-content">
          <div class="item-title"><strong>${r.name}</strong> (${r.category}) — Qty: ${r.quantity}</div>
          <div class="meta">
            Status: <span class="badge ${r.status==='ALLOCATED'?'assigned':'open'}">${r.status}</span> • 
            Allocated to: ${r.allocated_to || '—'}
          </div>
        </div>
        <div class="item-actions">
          ${r.status==='AVAILABLE'
            ? `<button class="secondary" onclick="allocateResource(${r.id})">📌 Allocate</button>`
            : `<button class="danger" onclick="releaseResource(${r.id})">🔓 Release</button>`}
        </div>`;
      ul.appendChild(li);
    });
  } catch(err) {
    console.error('Error fetching resources:', err);
  }
}

document.getElementById('resourceForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const name=document.getElementById('rname').value;
  const category=document.getElementById('rcategory').value;
  const quantity=parseInt(document.getElementById('rquantity').value);
  try {
    await fetch(API+'/resources',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,category,quantity})});
    e.target.reset();
    await loadResources();
  } catch(err) {
    console.error('Error adding resource:', err);
    alert('Error adding resource');
  }
});

async function allocateResource(id){
  const department=prompt('Enter department to allocate to:');
  if(!department) return;
  try {
    await fetch(API+'/allocate/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({department})});
    await loadResources();
  } catch(err) {
    console.error('Error allocating resource:', err);
    alert('Error allocating resource');
  }
}

async function releaseResource(id){
  if(!confirm('Release this resource?')) return;
  try {
    await fetch(API+'/release/'+id,{method:'POST'});
    await loadResources();
  } catch(err) {
    console.error('Error releasing resource:', err);
    alert('Error releasing resource');
  }
}

async function loadAgents(){
  try {
    const r=await fetch(API + '/agents');
    const agents=await r.json();
    const container=document.getElementById('agents');
    container.innerHTML='';
    
    if(agents.length === 0){
      container.innerHTML='<div class="empty-state">🤖<br>No agents found</div>';
      return;
    }
    
    agents.forEach(a=>{
      const div=document.createElement('div');
      div.className='agent';
      div.innerHTML=`<strong>🤖 ${a.name}</strong><div>${a.specialties}</div>`;
      div.onclick=async ()=>{
        selectedAgent = selectedAgent===a.name?null:a.name;
        document.querySelectorAll('#agents .agent').forEach(el=>el.classList.remove('selected'));
        if(selectedAgent) div.classList.add('selected');
        currentTaskId = null;
        await refresh();
      };
      container.appendChild(div);
    });
  } catch(err) {
    console.error('Error fetching agents:', err);
  }
}

async function loadAgentMessages(agentName){
  try {
    const resp=await fetch(API+'/agent_messages/'+encodeURIComponent(agentName));
    const logs=await resp.json();
    const pane=document.getElementById('chatPane');
    pane.innerHTML='';
    
    if(logs.length === 0){
      pane.innerHTML='<div class="empty-state">💬<br>No messages yet</div>';
      return;
    }
    
    logs.forEach(l=>{
      const el=document.createElement('div');
      el.className=l.role==='assistant'?'chat':(l.role==='user'?'user':'small');
      el.innerHTML=`<div class="small"><strong>Task #${l.task_id} - ${l.role}</strong> — ${new Date(l.ts).toLocaleString()}</div><div>${l.message}</div>`;
      pane.appendChild(el);
    });
    pane.scrollTop=pane.scrollHeight;
  } catch(err) {
    console.error('Error fetching agent messages:', err);
  }
}

document.getElementById('taskForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const department=document.getElementById('department').value;
  const description=document.getElementById('description').value;
  const assignee=document.getElementById('assignee').value||null;
  try {
    await fetch(API+'/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({department,description,assignee})});
    document.getElementById('taskForm').reset();
    await refresh();
  } catch(err) {
    console.error('Error creating task:', err);
    alert('Error creating task');
  }
});

async function deleteTask(taskId){
  if(!confirm('Delete this task?')) return;
  try {
    const resp = await fetch(`${API}/tasks/${taskId}`, { method: 'DELETE' });
    if(resp.ok){
      if(currentTaskId===taskId){ 
        currentTaskId=null; 
        document.getElementById('chatPane').innerHTML='<div class="empty-state">💬<br>Select a task or agent to start chatting</div>'; 
      }
      await refresh();
    } else {
      const err = await resp.json();
      alert(`Failed to delete task: ${err.detail || 'Unknown error'}`);
    }
  } catch(err){
    console.error(err);
    alert('Error deleting task.');
  }
}

async function assign(taskId){
  try {
    const resp = await fetch(`${API}/assign/${taskId}`, { method: 'POST' });
    const data = await resp.json();
    alert(`✨ Task #${taskId} assigned to ${data.assigned_agent}`);
    await refresh();
    await openChat(taskId);
  } catch(err) {
    console.error(err);
    alert('Error assigning task.');
  }
}

async function openChat(id){
  currentTaskId=id;
  selectedAgent=null;
  document.querySelectorAll('#agents .agent').forEach(el=>el.classList.remove('selected'));
  await loadChat(id);
}

async function loadChat(id){
  try {
    const resp = await fetch(API + '/chat/' + id);
    const logs = await resp.json();
    const pane = document.getElementById('chatPane');
    pane.innerHTML = '';

    if(logs.length === 0){
      const el = document.createElement('div');
      el.className = 'small';
      el.style.textAlign = 'center';
      el.style.padding = '20px';
      el.innerHTML = 'No messages yet for this task.';
      pane.appendChild(el);
    } else {
      logs.forEach(l => {
        const el = document.createElement('div');
        el.className = l.role === 'assistant' ? 'chat' : (l.role === 'user' ? 'user' : 'small');
        el.innerHTML = `<div class="small"><strong>${l.role}</strong> — ${new Date(l.ts).toLocaleString()}</div><div>${l.message}</div>`;
        pane.appendChild(el);
      });
    }
    pane.scrollTop = pane.scrollHeight;
  } catch(err) {
    console.error('Error loading chat:', err);
  }
}

document.getElementById('sendBtn').addEventListener('click',async ()=>{
  const text=document.getElementById('chatInput').value.trim();
  if(!text || (!currentTaskId && !selectedAgent)) {
    alert('⚠️ Select a task or agent and type a message.');
    return;
  }
  document.getElementById('chatInput').value='';

  try {
    if(currentTaskId){
      await fetch(API+'/chat/'+currentTaskId,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
      await loadChat(currentTaskId);
    } else if(selectedAgent){
      const tasksResp = await fetch(API+'/tasks');
      const allTasks = await tasksResp.json();
      const tasks = allTasks.filter(t=>t.assigned_agent===selectedAgent);
      for(const t of tasks){
        await fetch(API+'/chat/'+t.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
      }
      await loadAgentMessages(selectedAgent);
    }
  } catch(err) {
    console.error('Error sending message:', err);
    alert('Error sending message');
  }
});

document.getElementById('chatInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    document.getElementById('sendBtn').click();
  }
});

// Initialize
console.log('Initializing application...');
loadAgents();
refresh();
loadResources();
</script>
</body>
</html>
